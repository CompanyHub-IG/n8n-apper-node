# Publishes this n8n community node package to the public npm registry
# on every version tag push.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# 1. Go to https://www.npmjs.com → Access Tokens → Generate New Token
#    → select "Automation" (works in CI without 2FA prompts).
# 2. Copy the token.
# 3. In your GitHub repo: Settings → Secrets and variables → Actions
#    → New repository secret → Name: NPM_TOKEN, Value: paste the token.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "v*.*.*" (e.g. v0.0.4).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Option A — interactive (recommended):
#   npm run release
#
# Option B — manual:
#   1. npm version patch          (or minor / major)
#   2. git push origin master --tags
#
# Both trigger this workflow, which builds, lints, and publishes to npm.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
