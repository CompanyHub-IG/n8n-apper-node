# Publishes this n8n community node package to GitHub Packages on every
# version tag push.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# No extra secrets are needed. The built-in GITHUB_TOKEN has write:packages
# permission when configured below.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "v*.*.*" (e.g. v0.0.3).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# 1. Bump the version in package.json:  npm version patch  (or minor / major)
# 2. Push the commit and tag:           git push origin master --tags
# 3. This workflow runs automatically and publishes to GitHub Packages.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@CompanyHub-IG'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
